# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Yuchen的博客
subtitle: 诚谬会以取拙，且欣然而归止。
description: Yuchen 的个人博客
keywords:
author: FengYuchen1314
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://www.chrono-well.top
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# ShokaX 使用 Aether 渲染器 + Shiki 高亮，需关闭 Hexo 默认高亮
syntax_highlighter: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
  实用教程: tutorials
  杂谈: misc
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: shokax

# ShokaX 推荐压缩配置
minify:
  js:
    enable: false
    exclude:
  css:
    enable: true
    options:
      targets: ">= 0.5%"
    exclude:
  html:
    minifier: html-minifier
    enable: true
    options:
      comments: false
    exclude:
  image:
    enable: false
    options:
      avif: false
      webp: true
      quality: 80
      effort: 2
      replaceSrc: false
    exclude:

# Feed
feed:
  limit: 20
  order_by: "-date"
  tag_dir: false
  category_dir: false
  rss:
    enable: true
    template: "node_modules/hexo-theme-shokax/layout/_alternate/rss.ejs"
    output: "rss.xml"
  atom:
    enable: true
    template: "node_modules/hexo-theme-shokax/layout/_alternate/atom.ejs"
    output: "atom.xml"
  jsonFeed:
    enable: true
    template: "node_modules/hexo-theme-shokax/layout/_alternate/json.ejs"
    output: "feed.json"

deploy:
  type: ''
